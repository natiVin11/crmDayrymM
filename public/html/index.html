<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>התחברות</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>body { display: flex; justify-content: center; align-items: center; height: 100vh; }</style>
</head>
<body>
<div class="card" style="width: 100%; max-width: 400px; text-align: center;">
    <h2>כניסה למערכת</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="שם משתמש" required>
        <input type="password" id="password" placeholder="סיסמה" required>
        <button type="submit" id="loginBtn">התחבר</button>
    </form>
    <p id="errorMessage" class="error" style="display:none; color:red;"></p>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const userIn = document.getElementById('username').value;
        const passIn = document.getElementById('password').value;
        try {
            const res = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: userIn, password: passIn }) });
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('user', JSON.stringify(data.user));
                if (data.user.role === 'admin') window.location.href = '/html/admin.html';
                else if (data.user.role === 'manager') window.location.href = `/html/manager.html?userId=${data.user.id}`;
                else if (data.user.role === 'lawyer') window.location.href = `/html/lawyer.html?userId=${data.user.id}`;
                else window.location.href = `/html/user.html?userId=${data.user.id}`;
            } else { document.getElementById('errorMessage').textContent = 'פרטים שגויים'; document.getElementById('errorMessage').style.display = 'block'; }
        } catch (err) { document.getElementById('errorMessage').textContent = 'שגיאה'; document.getElementById('errorMessage').style.display = 'block'; }
    });
</script>
</body>
</html>
